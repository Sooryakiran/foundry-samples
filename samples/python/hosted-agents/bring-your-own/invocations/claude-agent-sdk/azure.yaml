# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.17'
    azure.ai.toolboxes: '>=1.0.0-beta.8'
name: claude-agent-sdk-invocations
services:
  ai-project:
    host: azure.ai.project
  claude-toolbox:
    host: azure.ai.toolbox
    uses:
      - ai-project
    description: Web search for the Claude Agent SDK sample
    tools:
      - type: web_search
        name: web_search
        description: Search the public web for current information.
        require_approval: never
  claude-agent-sdk-invocations:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Claude Agent SDK
        - Anthropic
        - Invocations Protocol
        - Bring Your Own
    project: src/claude-agent-sdk-invocations
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
      - claude-toolbox
    kind: hosted
    name: claude-agent-sdk-invocations
    displayName: Claude Agent SDK (Invocations)
    description: A getting-started agent that uses the Claude Agent SDK with Microsoft Foundry authentication and the azure-ai-agentserver-invocations protocol, streaming assistant deltas as Server-Sent Events (SSE).
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      CLAUDE_CODE_USE_FOUNDRY: '1'
      ANTHROPIC_MODEL: claude-opus-4-7
      TOOLBOX_ENDPOINT: ${TOOLBOX_CLAUDE_TOOLBOX_MCP_ENDPOINT}
      TOOLBOX_ALLOWED_TOOLS: web_search
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
